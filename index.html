<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #07111f;
      color: #eaf6ff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .app {
      width: 100%;
      max-width: 600px;
      border: 1px solid #164e63;
      border-radius: 20px;
      padding: 22px;
      background: #0c1b2b;
      box-shadow: 0 0 30px #0891b222;
    }
    h1 { color: #67e8f9; text-align: center; }
    #status { text-align: center; color: #a5f3fc; }
    #chat {
      height: 330px;
      overflow-y: auto;
      margin: 20px 0;
      padding: 12px;
      border-radius: 12px;
      background: #06101c;
    }
    .msg {
      padding: 11px;
      margin: 9px 0;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    .user { background: #164e63; }
    .bot { background: #17283b; }
    .controls { display: flex; gap: 8px; }
    input {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #155e75;
      background: #07111f;
      color: white;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      color: #04111d;
      background: #67e8f9;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <main class="app">
    <h1>JARVIS AI</h1>
    <p id="status">Hello Sir, All Systems Are Ready</p>
    <div id="chat" aria-live="polite">
      <div class="msg bot">Hello Sir! I am Jarvis. How can I help you?</div>
    </div>
    <form id="form" class="controls">
      <input id="message" placeholder="Ask Jarvis anything..." autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    // Replace this with your actual Cloudflare Worker URL.
    const WORKER_URL = "https://jarvis-ai-backend.babbarv48.workers.dev/";

    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");
    const send = document.getElementById("send");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || send.disabled) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;
      status.textContent = "Jarvis is thinking...";
      const loading = addMessage("Please wait...", "bot");

      try {
        if (WORKER_URL.includes("PASTE_YOUR")) {
          throw new Error("First add your Cloudflare Worker URL in the code.");
        }

        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Request failed.");
        }

        loading.textContent = data.reply || "No reply received.";
        status.textContent = "Gemini AI connected";
      } catch (error) {
        loading.textContent = "Error: " + error.message;
        status.textContent = "Connection needs checking";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
